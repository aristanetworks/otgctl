[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "otgctl"
version = "0.9.1"
description = "CLI tool for making OTG REST API calls"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=5.4.1",
    "requests>=2.25.1",
]

[project.scripts]
otgctl = "otgctl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
