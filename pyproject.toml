[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "otgctl"
version = "0.9.2rc3"
description = "CLI tool for making OTG REST API calls"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=5.4.1",
    "requests>=2.25.1",
]
readme = "README.md"
authors = [
    { name = "Arista Networks" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Topic :: System :: Networking",
]

[project.scripts]
otgctl = "otgctl.cli:main"

[project.optional-dependencies]
snappi = [
    "snappi",
]
test = [
    "pytest>=6.2.2",
    "pytest-cov>=4.0.0",
]
release = [
    "build>=1.0",
    "twine>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
